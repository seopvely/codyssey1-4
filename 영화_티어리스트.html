<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 티어리스트 공유 서비스</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    header {
      padding: 28px 16px;
      text-align: center;
      background: #0f172a;
      border-bottom: 1px solid #374151;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #9ca3af;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    section {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 18px;
    }

    h2 {
      margin-top: 0;
    }

    .notice {
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 12px;
      background: rgba(96, 165, 250, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.5;
    }

    input, button {
      font: inherit;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #f9fafb;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #60a5fa;
      color: #08111f;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #6b7280;
      color: #fff;
    }

    button.danger {
      background: #f87171;
      color: #111827;
    }

    button.success {
      background: #34d399;
      color: #111827;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .movie-list {
      display: grid;
      gap: 10px;
      max-height: 460px;
      overflow: auto;
    }

    .result-card,
    .movie-card {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 10px;
      align-items: center;
      background: #111827;
      border: 1px solid #4b5563;
      border-radius: 14px;
      padding: 10px;
    }

    .poster {
      width: 58px;
      height: 82px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(145deg, #2563eb, #7c3aed);
      object-fit: cover;
    }

    .movie-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .movie-meta {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.4;
    }

    .tier-board {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .tier-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      min-height: 124px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 14px;
      overflow: hidden;
    }

    .tier-label {
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 900;
      color: #111827;
    }

    .tier-label.S { background: #ef4444; }
    .tier-label.A { background: #f97316; }
    .tier-label.B { background: #eab308; }
    .tier-label.C { background: #22c55e; }
    .tier-label.D { background: #3b82f6; }

    .dropzone {
      min-height: 122px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px;
    }

    .dropzone.drag-over {
      background: rgba(96, 165, 250, 0.18);
    }

    .movie-card {
      width: 230px;
      cursor: grab;
      user-select: none;
    }

    .empty {
      color: #9ca3af;
      font-size: 14px;
      align-self: center;
    }

    .pool {
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed #6b7280;
      background: #111827;
    }

    .pool-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .pool-title small {
      color: #9ca3af;
      font-weight: normal;
    }

    .share-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #374151;
      background: #111827;
    }

    .share-box input {
      margin-top: 8px;
      font-size: 13px;
    }

    .saved-list {
      display: grid;
      gap: 8px;
    }

    .saved-item {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #4b5563;
      background: #111827;
      cursor: pointer;
    }

    .saved-item:hover {
      border-color: #60a5fa;
    }

    .saved-item span {
      color: #9ca3af;
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(420px, 100%);
      padding: 18px;
      border-radius: 18px;
      border: 1px solid #4b5563;
      background: #1f2937;
    }

    .grade-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .grade-S { background: #ef4444; }
    .grade-A { background: #f97316; }
    .grade-B { background: #eab308; }
    .grade-C { background: #22c55e; }
    .grade-D { background: #3b82f6; }

    footer {
      padding: 30px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      .search-box {
        flex-direction: column;
      }

      .tier-row {
        grid-template-columns: 56px 1fr;
      }

      .tier-label {
        font-size: 24px;
      }

      .movie-card {
        width: 100%;
      }

      .button-row button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>영화 티어리스트</h1>
    <p>영화를 검색하고 S/A/B/C/D 등급에 배치한 뒤 저장하고 공유해보세요.</p>
  </header>

  <main>
    <section>
      <h2>영화 검색</h2>

      <div class="notice">
        TMDB API 키를 입력해 영화를 검색합니다. 검색과 포스터 표시에는 인터넷 연결이 필요하며, 키는 이 브라우저에 저장됩니다.
      </div>

      <div class="search-box">
        <input id="apiKeyInput" type="password" autocomplete="off" placeholder="TMDB API 키 또는 Read Access Token" aria-label="TMDB API 키 또는 Read Access Token" />
        <button id="saveApiKeyButton" type="button">키 저장</button>
      </div>

      <div class="search-box">
        <input id="searchInput" type="search" placeholder="영화 제목을 검색하세요. 예: 기생충" />
        <button id="searchButton">검색</button>
      </div>

      <div class="button-row" aria-label="검색 결과 정렬">
        <button class="secondary" id="sortRatingButton" type="button">평점 높은 순</button>
        <button class="secondary" id="sortRandomButton" type="button">랜덤 순</button>
      </div>

      <div id="searchResults" class="movie-list"></div>

      <h2 style="margin-top:24px;">다른 티어리스트 둘러보기</h2>
      <div id="savedLists" class="saved-list"></div>
    </section>

    <section>
      <h2>내 티어표</h2>

      <input id="listTitle" type="text" value="나의 영화 티어리스트" />

      <div class="button-row">
        <button class="success" id="saveButton">저장</button>
        <button id="shareButton">링크 만들기</button>
        <button id="imageButton">이미지로 저장</button>
        <button id="randomTierButton" type="button">평점 기준 랜덤 티어</button>
        <button class="secondary" id="sampleButton">샘플 불러오기</button>
        <button class="danger" id="resetButton">초기화</button>
      </div>

      <div class="share-box">
        <strong>공유 링크</strong>
        <input id="shareLink" type="text" readonly placeholder="링크 만들기 버튼을 누르면 생성됩니다." />
      </div>

      <div class="pool">
        <div class="pool-title">
          <span>대기 중인 영화</span>
          <small>PC: 드래그 / 모바일: 탭해서 등급 선택</small>
        </div>
        <div id="poolZone" class="dropzone" data-tier="POOL"></div>
      </div>

      <div id="tierBoard" class="tier-board"></div>
    </section>
  </main>

  <div id="gradeModal" class="modal-backdrop">
    <div class="modal">
      <h2 id="modalTitle">등급 선택</h2>
      <p style="color:#9ca3af;">선택한 영화를 어느 등급에 배치할까요?</p>
      <div class="grade-buttons">
        <button class="grade-S" data-grade="S">S</button>
        <button class="grade-A" data-grade="A">A</button>
        <button class="grade-B" data-grade="B">B</button>
        <button class="grade-C" data-grade="C">C</button>
        <button class="grade-D" data-grade="D">D</button>
        <button class="secondary" data-grade="POOL">대기</button>
      </div>
      <div class="button-row">
        <button class="danger" id="deleteMovieButton">삭제</button>
        <button class="secondary" id="closeModalButton">닫기</button>
      </div>
    </div>
  </div>

  <footer>
    별도 서버 없이 TMDB API를 직접 사용합니다. TMDB 검색과 포스터 표시에 인터넷 연결이 필요합니다.
  </footer>

  <script>
	const STORAGE_CURRENT = "movie_tier_current_v1";
	const STORAGE_SAVED = "movie_tier_saved_v1";
	const STORAGE_TMDB_KEY = "movie_tier_tmdb_key_v1";
  
	const grades = ["S", "A", "B", "C", "D"];
  
	const sampleMovies = [
	  { id: "m1", title: "기생충", year: 2019, rating: 8.5 },
	  { id: "m2", title: "올드보이", year: 2003, rating: 8.4 },
	  { id: "m3", title: "살인의 추억", year: 2003, rating: 8.1 },
	  { id: "m4", title: "부산행", year: 2016, rating: 7.8 },
	  { id: "m5", title: "헤어질 결심", year: 2022, rating: 7.4 },
	  { id: "m6", title: "범죄도시", year: 2017, rating: 7.8 },
	  { id: "m7", title: "인터스텔라", year: 2014, rating: 8.7 },
	  { id: "m8", title: "인셉션", year: 2010, rating: 8.8 },
	  { id: "m9", title: "다크 나이트", year: 2008, rating: 9.0 },
	  { id: "m10", title: "어벤져스: 엔드게임", year: 2019, rating: 8.4 },
	  { id: "m11", title: "라라랜드", year: 2016, rating: 8.0 },
	  { id: "m12", title: "너의 이름은.", year: 2016, rating: 8.4 },
	  { id: "m13", title: "쇼생크 탈출", year: 1994, rating: 9.3 },
	  { id: "m14", title: "포레스트 검프", year: 1994, rating: 8.8 },
	  { id: "m15", title: "타이타닉", year: 1997, rating: 7.9 },
	  { id: "m16", title: "센과 치히로의 행방불명", year: 2001, rating: 8.6 }
	];
  
	let state = createEmptyState();
	let selectedMovieId = null;
	let currentSearchResults = [];
  
	const apiKeyInput = document.getElementById("apiKeyInput");
	const saveApiKeyButton = document.getElementById("saveApiKeyButton");
	const searchInput = document.getElementById("searchInput");
	const searchButton = document.getElementById("searchButton");
	const sortRatingButton = document.getElementById("sortRatingButton");
	const sortRandomButton = document.getElementById("sortRandomButton");
	const randomTierButton = document.getElementById("randomTierButton");
	const searchResults = document.getElementById("searchResults");
	const tierBoard = document.getElementById("tierBoard");
	const poolZone = document.getElementById("poolZone");
	const listTitle = document.getElementById("listTitle");
	const shareLink = document.getElementById("shareLink");
	const savedLists = document.getElementById("savedLists");
  
	const saveButton = document.getElementById("saveButton");
	const shareButton = document.getElementById("shareButton");
	const imageButton = document.getElementById("imageButton");
	const sampleButton = document.getElementById("sampleButton");
	const resetButton = document.getElementById("resetButton");
  
	const gradeModal = document.getElementById("gradeModal");
	const modalTitle = document.getElementById("modalTitle");
	const closeModalButton = document.getElementById("closeModalButton");
	const deleteMovieButton = document.getElementById("deleteMovieButton");
  
	init();
  
	function init() {
	  renderTierBoard();
	  bindEvents();
  
	  const sharedState = loadFromUrlHash();
  
	  if (sharedState) {
		state = sharedState;
		saveCurrent();
	  } else {
		const saved = localStorage.getItem(STORAGE_CURRENT);
  
		if (saved) {
		  try {
			state = JSON.parse(saved);
		  } catch {
			state = createEmptyState();
		  }
		}
	  }
  
	  normalizeState();
	  listTitle.value = state.title || "나의 영화 티어리스트";
  
	  renderAll();
	}
  
	function createEmptyState() {
	  return {
		title: "나의 영화 티어리스트",
		movies: {},
		tiers: {
		  POOL: [],
		  S: [],
		  A: [],
		  B: [],
		  C: [],
		  D: []
		},
		updatedAt: Date.now()
	  };
	}
  
	function normalizeState() {
	  if (!state.title) state.title = "나의 영화 티어리스트";
	  if (!state.movies) state.movies = {};
	  if (!state.tiers) state.tiers = {};
  
	  ["POOL", ...grades].forEach((tier) => {
		if (!Array.isArray(state.tiers[tier])) {
		  state.tiers[tier] = [];
		}
	  });
  
	  Object.keys(state.tiers).forEach((tier) => {
		state.tiers[tier] = state.tiers[tier].filter((id) => state.movies[id]);
	  });
	}
  
	function bindEvents() {
	  saveApiKeyButton.addEventListener("click", saveTmdbKey);
	  apiKeyInput.addEventListener("keydown", (event) => {
		if (event.key === "Enter") saveTmdbKey();
	  });
	  searchButton.addEventListener("click", searchMovies);
	  sortRatingButton.addEventListener("click", () => {
		currentSearchResults.sort((a, b) => Number(b.rating) - Number(a.rating));
		renderSearchResults(currentSearchResults);
	  });
	  sortRandomButton.addEventListener("click", () => {
		currentSearchResults = shuffle(currentSearchResults);
		renderSearchResults(currentSearchResults);
	  });
	  randomTierButton.addEventListener("click", assignRandomTiersByRating);
  
	  searchInput.addEventListener("keydown", (event) => {
		if (event.key === "Enter") {
		  searchMovies();
		}
	  });
  
	  listTitle.addEventListener("input", () => {
		state.title = listTitle.value.trim() || "나의 영화 티어리스트";
		autoSave();
	  });
  
	  saveButton.addEventListener("click", saveTierList);
	  shareButton.addEventListener("click", createShareLink);
	  imageButton.addEventListener("click", exportAsImage);
	  sampleButton.addEventListener("click", loadSampleTierList);
	  resetButton.addEventListener("click", resetTierList);
  
	  closeModalButton.addEventListener("click", closeModal);
  
	  gradeModal.addEventListener("click", (event) => {
		if (event.target === gradeModal) {
		  closeModal();
		}
	  });
  
	  document.querySelectorAll("[data-grade]").forEach((button) => {
		button.addEventListener("click", () => {
		  const grade = button.dataset.grade;
		  if (selectedMovieId) {
			moveMovie(selectedMovieId, grade);
			closeModal();
		  }
		});
	  });
  
	  deleteMovieButton.addEventListener("click", () => {
		if (!selectedMovieId) return;
  
		const movie = state.movies[selectedMovieId];
		if (!movie) return;
  
		if (confirm(`"${movie.title}" 영화를 티어표에서 삭제할까요?`)) {
		  removeMovie(selectedMovieId);
		  closeModal();
		}
	  });
  
	  setupDropZone(poolZone);
	}
  
	function renderAll() {
	  apiKeyInput.value = localStorage.getItem(STORAGE_TMDB_KEY) || "";
	  searchResults.innerHTML = '<div class="empty">영화 제목을 검색하세요.</div>';
	  renderMovies();
	  renderSavedLists();
	}
  
	function renderTierBoard() {
	  tierBoard.innerHTML = "";
  
	  grades.forEach((grade) => {
		const row = document.createElement("div");
		row.className = "tier-row";
  
		row.innerHTML = `
		  <div class="tier-label ${grade}">${grade}</div>
		  <div class="dropzone" data-tier="${grade}"></div>
		`;
  
		tierBoard.appendChild(row);
  
		const zone = row.querySelector(".dropzone");
		setupDropZone(zone);
	  });
	}
  
	function renderMovies() {
	  renderZone(poolZone, "POOL");
  
	  grades.forEach((grade) => {
		const zone = document.querySelector(`.dropzone[data-tier="${grade}"]`);
		renderZone(zone, grade);
	  });
	}
  
	function renderZone(zone, tier) {
	  zone.innerHTML = "";
  
	  const ids = state.tiers[tier] || [];
  
	  if (ids.length === 0) {
		const empty = document.createElement("div");
		empty.className = "empty";
		empty.textContent = tier === "POOL"
		  ? "검색 결과에서 영화를 추가하면 여기에 표시됩니다."
		  : "이 등급에는 아직 영화가 없습니다.";
		zone.appendChild(empty);
		return;
	  }
  
	  ids.forEach((id) => {
		const movie = state.movies[id];
		if (!movie) return;
  
		zone.appendChild(createMovieCard(movie));
	  });
	}
  
	function createMovieCard(movie) {
	  const card = document.createElement("div");
	  card.className = "movie-card";
	  card.draggable = true;
	  card.dataset.id = movie.id;
  
	  const posterMarkup = movie.posterUrl
		? `<img class="poster" src="${escapeHtml(movie.posterUrl)}" alt="${escapeHtml(movie.title)} 포스터" />`
		: `<div class="poster">${escapeHtml(movie.title.charAt(0))}</div>`;

	  card.innerHTML = `
		${posterMarkup}
		<div>
		  <div class="movie-title">${escapeHtml(movie.title)}</div>
		  <div class="movie-meta">${movie.year}년 · 평점 ${movie.rating}</div>
		</div>
	  `;
  
	  card.addEventListener("dragstart", (event) => {
		event.dataTransfer.setData("text/plain", movie.id);
	  });
  
	  card.addEventListener("click", () => {
		openModal(movie.id);
	  });
  
	  return card;
	}
  
	function setupDropZone(zone) {
	  zone.addEventListener("dragover", (event) => {
		event.preventDefault();
		zone.classList.add("drag-over");
	  });
  
	  zone.addEventListener("dragleave", () => {
		zone.classList.remove("drag-over");
	  });
  
	  zone.addEventListener("drop", (event) => {
		event.preventDefault();
		zone.classList.remove("drag-over");
  
		const movieId = event.dataTransfer.getData("text/plain");
		const tier = zone.dataset.tier;
  
		if (movieId && tier) {
		  moveMovie(movieId, tier);
		}
	  });
	}
  
	function saveTmdbKey() {
	  const key = apiKeyInput.value.trim();
	  if (!key) {
		localStorage.removeItem(STORAGE_TMDB_KEY);
		alert("저장된 TMDB 키를 삭제했습니다.");
		return;
	  }
	  localStorage.setItem(STORAGE_TMDB_KEY, key);
	  alert("TMDB 키를 이 브라우저에 저장했습니다.");
	}

	function getTmdbAuth(key) {
	  // TMDB Read Access Token은 JWT 형태이며, v3 API 키는 query parameter로 전달합니다.
	  if (key.startsWith("eyJ")) {
		return { headers: { Authorization: `Bearer ${key}`, accept: "application/json" } };
	  }
	  return { headers: { accept: "application/json" }, apiKeyParam: `api_key=${encodeURIComponent(key)}` };
	}

	async function searchMovies() {
	  const keyword = searchInput.value.trim();
	  const key = localStorage.getItem(STORAGE_TMDB_KEY) || apiKeyInput.value.trim();

	  if (!key) {
		alert("먼저 TMDB API 키 또는 Read Access Token을 입력하고 키 저장을 눌러주세요.");
		return;
	  }
	  if (!keyword) {
		searchResults.innerHTML = '<div class="empty">검색할 영화 제목을 입력하세요.</div>';
		return;
	  }

	  searchResults.innerHTML = '<div class="empty">TMDB에서 검색 중입니다…</div>';
	  try {
		const auth = getTmdbAuth(key);
		const query = new URLSearchParams({ query: keyword, language: "ko-KR", include_adult: "false" });
		const keyParam = auth.apiKeyParam ? `&${auth.apiKeyParam}` : "";
		const response = await fetch(`https://api.themoviedb.org/3/search/movie?${query}${keyParam}`, auth);
		if (!response.ok) {
		  if (response.status === 401) throw new Error("TMDB 키가 올바르지 않습니다. 키 종류와 값을 확인해주세요.");
		  throw new Error(`TMDB 요청에 실패했습니다 (HTTP ${response.status}).`);
		}
		const data = await response.json();
		const results = (data.results || []).map((item) => ({
		  id: `tmdb-${item.id}`,
		  title: item.title || item.original_title || "제목 없음",
		  year: item.release_date ? item.release_date.slice(0, 4) : "연도 미상",
		  rating: Number(item.vote_average || 0).toFixed(1),
		  posterUrl: item.poster_path ? `https://image.tmdb.org/t/p/w185${item.poster_path}` : ""
		}));
		currentSearchResults = results;
		renderSearchResults(results);
	  } catch (error) {
		searchResults.innerHTML = `<div class="empty">${escapeHtml(error.message || "검색에 실패했습니다.")}</div>`;
	  }
	}

	function renderSearchResults(results) {
	  searchResults.innerHTML = "";
  
	  if (results.length === 0) {
		searchResults.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
		return;
	  }
  
	  results.forEach((movie) => {
		const card = document.createElement("div");
		card.className = "result-card";
  
		const posterMarkup = movie.posterUrl
		  ? `<img class="poster" src="${escapeHtml(movie.posterUrl)}" alt="${escapeHtml(movie.title)} 포스터" />`
		  : `<div class="poster">${escapeHtml(movie.title.charAt(0))}</div>`;

		card.innerHTML = `
		  ${posterMarkup}
		  <div>
			<div class="movie-title">${escapeHtml(movie.title)}</div>
			<div class="movie-meta">${movie.year}년 · 평점 ${movie.rating}</div>
			<button type="button">대기 목록에 추가</button>
		  </div>
		`;
  
		card.querySelector("button").addEventListener("click", () => {
		  if (addMovie(movie)) {
			openModal(movie.id);
		  }
		});
  
		searchResults.appendChild(card);
	  });
	}

	function shuffle(items) {
	  const shuffled = [...items];
	  for (let i = shuffled.length - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
	  }
	  return shuffled;
	}

	function assignRandomTiersByRating() {
	  const movieIds = Object.keys(state.movies);
	  if (movieIds.length === 0) {
		alert("먼저 검색 결과에서 영화를 티어표에 추가해주세요.");
		return;
	  }
	  if (!confirm("추가된 모든 영화를 평점이 높을수록 높은 티어에 배치하고, 같은 평점대에서는 무작위 순서로 배치할까요?")) return;

	  const sorted = shuffle(movieIds.map((id) => state.movies[id]))
		.sort((a, b) => Number(b.rating) - Number(a.rating));
	  const tierByPercentile = ["S", "A", "B", "C", "D"];
	  state.tiers = { POOL: [], S: [], A: [], B: [], C: [], D: [] };
	  sorted.forEach((movie, index) => {
		const tierIndex = Math.min(4, Math.floor(index * 5 / sorted.length));
		state.tiers[tierByPercentile[tierIndex]].push(movie.id);
	  });
	  state.title = listTitle.value.trim() || "나의 영화 티어리스트";
	  renderMovies();
	  autoSave();
	  alert("평점 순위에 따라 티어를 배치했습니다. 동점 영화의 순서는 무작위입니다.");
	}
  
	function addMovie(movie) {
	  if (state.movies[movie.id]) {
		alert("이미 추가된 영화입니다.");
		return false;
	  }
  
	  state.movies[movie.id] = { ...movie };
	  state.tiers.POOL.push(movie.id);
  
	  renderMovies();
	  autoSave();
	  return true;
	}
  
	function moveMovie(movieId, targetTier) {
	  if (!state.movies[movieId]) return;
	  if (!state.tiers[targetTier]) return;
  
	  Object.keys(state.tiers).forEach((tier) => {
		state.tiers[tier] = state.tiers[tier].filter((id) => id !== movieId);
	  });
  
	  state.tiers[targetTier].push(movieId);
  
	  renderMovies();
	  autoSave();
	}
  
	function removeMovie(movieId) {
	  delete state.movies[movieId];
  
	  Object.keys(state.tiers).forEach((tier) => {
		state.tiers[tier] = state.tiers[tier].filter((id) => id !== movieId);
	  });
  
	  renderMovies();
	  autoSave();
	}
  
	function openModal(movieId) {
	  selectedMovieId = movieId;
  
	  const movie = state.movies[movieId];
	  if (!movie) return;
  
	  modalTitle.textContent = `"${movie.title}" 등급 선택`;
	  gradeModal.classList.add("show");
	}
  
	function closeModal() {
	  selectedMovieId = null;
	  gradeModal.classList.remove("show");
	}
  
	function saveCurrent() {
	  state.updatedAt = Date.now();
	  localStorage.setItem(STORAGE_CURRENT, JSON.stringify(state));
	}
  
	function autoSave() {
	  saveCurrent();
	}
  
	function saveTierList() {
	  state.title = listTitle.value.trim() || "나의 영화 티어리스트";
	  saveCurrent();
  
	  const saved = getSavedLists();
  
	  const copy = JSON.parse(JSON.stringify(state));
	  copy.savedId = "list_" + Date.now();
	  copy.updatedAt = Date.now();
  
	  saved.unshift(copy);
  
	  localStorage.setItem(STORAGE_SAVED, JSON.stringify(saved.slice(0, 10)));
  
	  renderSavedLists();
	  alert("티어리스트가 저장되었습니다.");
	}
  
	function getSavedLists() {
	  const raw = localStorage.getItem(STORAGE_SAVED);
  
	  if (!raw) return [];
  
	  try {
		return JSON.parse(raw);
	  } catch {
		return [];
	  }
	}
  
	function renderSavedLists() {
	  const lists = getSavedLists();
  
	  savedLists.innerHTML = "";
  
	  if (lists.length === 0) {
		savedLists.innerHTML = `<div class="empty">아직 저장된 티어리스트가 없습니다.</div>`;
		return;
	  }
  
	  lists.forEach((item) => {
		const div = document.createElement("div");
		div.className = "saved-item";
  
		const count = Object.keys(item.movies || {}).length;
		const date = new Date(item.updatedAt || Date.now()).toLocaleString("ko-KR");
  
		div.innerHTML = `
		  <strong>${escapeHtml(item.title || "제목 없는 티어리스트")}</strong>
		  <span>${count}개 영화 · ${date}</span>
		`;
  
		div.addEventListener("click", () => {
		  if (confirm("이 티어리스트를 불러올까요? 현재 작업 내용은 바뀝니다.")) {
			state = JSON.parse(JSON.stringify(item));
			normalizeState();
			listTitle.value = state.title;
			saveCurrent();
			renderMovies();
		  }
		});
  
		savedLists.appendChild(div);
	  });
	}
  
	function createShareLink() {
	  state.title = listTitle.value.trim() || "나의 영화 티어리스트";
	  saveCurrent();
  
	  const data = encodeState(state);
	  const url = `${location.origin}${location.pathname}#data=${data}`;
  
	  shareLink.value = url;
  
	  navigator.clipboard?.writeText(url)
		.then(() => {
		  alert("공유 링크가 클립보드에 복사되었습니다.");
		})
		.catch(() => {
		  alert("공유 링크가 생성되었습니다. 직접 복사해서 사용하세요.");
		});
	}
  
	function encodeState(data) {
	  const json = JSON.stringify(data);
	  return btoa(unescape(encodeURIComponent(json)));
	}
  
	function decodeState(encoded) {
	  const json = decodeURIComponent(escape(atob(encoded)));
	  return JSON.parse(json);
	}
  
	function loadFromUrlHash() {
	  if (!location.hash.startsWith("#data=")) {
		return null;
	  }
  
	  try {
		const encoded = location.hash.replace("#data=", "");
		return decodeState(encoded);
	  } catch {
		alert("공유 링크 데이터를 불러오지 못했습니다.");
		return null;
	  }
	}
  
	function loadSampleTierList() {
    if (!confirm("샘플 티어리스트를 불러올까요? 현재 작업 내용은 바뀝니다.")) {
      return;
    }

    state = createEmptyState();
    state.title = "샘플 영화 티어리스트";

    sampleMovies.forEach((movie) => {
      state.movies[movie.id] = { ...movie };
    });

    state.tiers.S = ["m13", "m9", "m8", "m1"];
    state.tiers.A = ["m7", "m2", "m3", "m12"];
    state.tiers.B = ["m4", "m11", "m14", "m15"];
    state.tiers.C = ["m5", "m6", "m10"];
    state.tiers.D = ["m16"];
    state.tiers.POOL = [];

    listTitle.value = state.title;

    renderMovies();
    saveCurrent();

    alert("샘플 티어리스트를 불러왔습니다.");
  }

  function resetTierList() {
    if (!confirm("정말 초기화할까요? 현재 티어리스트가 모두 삭제됩니다.")) {
      return;
    }

    state = createEmptyState();
    listTitle.value = state.title;
    shareLink.value = "";

    renderMovies();
    saveCurrent();

    alert("초기화되었습니다.");
  }

  function exportAsImage() {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const width = 1200;
    const rowHeight = 170;
    const headerHeight = 120;
    const padding = 30;
    const labelWidth = 100;
    const cardWidth = 240;
    const cardHeight = 70;
    const cardGap = 12;

    canvas.width = width;
    canvas.height = headerHeight + grades.length * rowHeight + padding;

    // 배경
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 제목
    ctx.fillStyle = "#f9fafb";
    ctx.font = "bold 36px Arial";
    ctx.fillText(state.title || "나의 영화 티어리스트", padding, 55);

    ctx.fillStyle = "#9ca3af";
    ctx.font = "18px Arial";
    ctx.fillText("Movie Tier List", padding, 88);

    const gradeColors = {
      S: "#ef4444",
      A: "#f97316",
      B: "#eab308",
      C: "#22c55e",
      D: "#3b82f6"
    };

    grades.forEach((grade, index) => {
      const y = headerHeight + index * rowHeight;

      // 티어 행 배경
      ctx.fillStyle = "#1f2937";
      roundRect(ctx, padding, y, width - padding * 2, rowHeight - 12, 14);
      ctx.fill();

      // 등급 라벨
      ctx.fillStyle = gradeColors[grade];
      roundRect(ctx, padding, y, labelWidth, rowHeight - 12, 14);
      ctx.fill();

      ctx.fillStyle = "#111827";
      ctx.font = "bold 42px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(grade, padding + labelWidth / 2, y + (rowHeight - 12) / 2);

      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";

      const movieIds = state.tiers[grade] || [];

      if (movieIds.length === 0) {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "18px Arial";
        ctx.fillText("이 등급에는 아직 영화가 없습니다.", padding + labelWidth + 24, y + 50);
        return;
      }

      movieIds.forEach((id, movieIndex) => {
        const movie = state.movies[id];
        if (!movie) return;

        const x = padding + labelWidth + 24 + (movieIndex % 4) * (cardWidth + cardGap);
        const cardY = y + 20 + Math.floor(movieIndex / 4) * (cardHeight + cardGap);

        if (cardY + cardHeight > y + rowHeight - 20) {
          return;
        }

        // 카드 배경
        ctx.fillStyle = "#111827";
        roundRect(ctx, x, cardY, cardWidth, cardHeight, 12);
        ctx.fill();

        // 포스터 대체 박스
        ctx.fillStyle = "#2563eb";
        roundRect(ctx, x + 10, cardY + 10, 42, 50, 8);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(movie.title.charAt(0), x + 31, cardY + 35);

        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";

        // 영화 제목
        ctx.fillStyle = "#f9fafb";
        ctx.font = "bold 16px Arial";
        ctx.fillText(cutText(ctx, movie.title, 160), x + 62, cardY + 30);

        // 영화 정보
        ctx.fillStyle = "#9ca3af";
        ctx.font = "13px Arial";
        ctx.fillText(`${movie.year}년 · 평점 ${movie.rating}`, x + 62, cardY + 52);
      });
    });

    // 다운로드
    const link = document.createElement("a");
    link.download = "movie-tier-list.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }

  function roundRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function cutText(ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) {
      return text;
    }

    let result = text;

    while (result.length > 0 && ctx.measureText(result + "...").width > maxWidth) {
      result = result.slice(0, -1);
    }

    return result + "...";
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>
